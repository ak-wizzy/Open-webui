
services:
  open-webui:
    image: akwizzy/pilot-repo:open-webui
    container_name: open-webui
    restart: unless-stopped
    init: true

    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"

    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:?Set OLLAMA_BASE_URL}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY}"

    volumes:
      - open-webui-data:/app/backend/data

    networks:
      - pilot-network

volumes:
  open-webui-data:
    name: open-webui-data

networks:
  pilot-network:
    external: true
