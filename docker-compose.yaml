
services:
  open-webui:
    image: akwizzy/pilot-repo:open-webui
    container_name: open-webui
    restart: unless-stopped
    init: true

    ports:
      - "${OPEN_WEBUI_PORT}:8080"

    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"

      WEBUI_URL: "${OPEN_WEBUI_URL}"

      ENABLE_OAUTH: "${ENABLE_OAUTH}"
      ENABLE_OAUTH_SIGNUP: "${ENABLE_OAUTH_SIGNUP}"

      MICROSOFT_CLIENT_ID: "${OPENWEBUI_CLIENT_ID}"
      MICROSOFT_CLIENT_SECRET: "${OPENWEBUI_CLIENT_SECRET}"
      MICROSOFT_CLIENT_TENANT_ID: "${ENTRA_TENANT_ID}"
      MICROSOFT_REDIRECT_URI: "${OPENWEBUI_REDIRECT_URI}"
      MICROSOFT_OAUTH_SCOPE: "${OPENWEBUI_OAUTH_SCOPE}"

    volumes:
      - open-webui-data:/app/backend/data

    networks:
      - pilot-network

volumes:
  open-webui-data:
    name: open-webui-data

networks:
  pilot-network:
    external: true
